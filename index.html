<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7a5a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>مخزون ومبيعات الإكسسوارات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="config.js"></script>
<style id="pg"></style>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--pr:#0a7a5a;--bd:#e3e6ea;--red:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1f2428;--tx:#eceff1;--mu:#9aa4ad;--pr:#2bb88a;--bd:#2f363c;--red:#ff6b5b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 76px}
nav{position:fixed;bottom:0;left:0;right:0;display:none;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 1px;font-size:12px}nav button.on{color:var(--pr);font-weight:700}
main{padding:12px;max-width:640px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;margin:3px 0}.btn.g{background:var(--bd);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi b{display:block;font-size:20px;color:var(--pr)}
.mu{color:var(--mu);font-size:13px}.low{color:var(--red);font-weight:700}video{width:100%;border-radius:10px;background:#000}.sc{overflow-x:auto}svg{max-width:100%}h3{margin:6px 0}
.pay .btn{padding:10px 4px;font-size:14px}.clk{cursor:pointer}
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0) 12px 24px}
.inv{background:#fff;color:#000;padding:10px;border-radius:8px;font-size:12px;line-height:1.5;max-width:300px;margin:8px auto;direction:rtl;border:1px solid #ddd}
.inv.a4{max-width:720px;font-size:15px}
.inv .c{text-align:center}.inv .big{font-size:1.25em;font-weight:700}.inv .sm{font-size:.85em;color:#444}
.inv table{width:100%;border-collapse:collapse;margin:6px 0}.inv th,.inv td{border-bottom:1px dashed #999;padding:3px 2px;text-align:right}
.inv .tt{margin-top:6px;text-align:right}
#pr{display:none}
@media print{
 body>*:not(#pr){display:none!important}#pr{display:block!important}body{background:#fff;padding:0}
 .inv{max-width:none!important;margin:0!important;border:0;border-radius:0;padding:0;page-break-after:always;break-after:page}
 .inv:last-child{page-break-after:auto;break-after:auto}
}
</style></head><body><main id="m"><div class="mu">جاري التحميل…</div></main>
<nav><button data-t="home">الرئيسية</button><button data-t="sell">بيع</button><button data-t="prod">المنتجات</button><button data-t="stock">المخزون</button><button data-t="tx">المعاملات</button><button data-t="count" data-o="1">الجرد</button></nav>
<div id="pr"></div>
<script src="a1.js"></script>
<script src="a2.js"></script>
<script src="a3.js"></script>
<script src="a4.js"></script>
<script src="a5.js"></script>
<script src="a6.js"></script>
</body></html>
